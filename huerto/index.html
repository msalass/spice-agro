<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Huerto · bitácora · SPICe Agro</title>
    <link rel="preconnect" href="https://cabin-ivory-granite-rapid.grok.me" />
    <style>
      body { margin:0; min-height:100dvh; font-family: ui-sans-serif, system-ui, sans-serif; background:#fffbdc; color:#191f39; }
      .wrap { min-height:100dvh; display:grid; place-items:center; padding:2rem 1.25rem; }
      .card { width:min(36rem,100%); padding:2rem 1.75rem; background:#fffdf3; border:1px solid #191f3920; }
      .kicker { font-size:0.7rem; letter-spacing:0.16em; text-transform:uppercase; color:#317286; margin:0 0 0.75rem; }
      h1 { font-family: Palatino, serif; font-size:clamp(2rem,5vw,2.75rem); letter-spacing:-0.03em; line-height:1.05; margin:0; }
      p { line-height:1.5; color:#191f39b8; }
      .actions { display:flex; flex-wrap:wrap; gap:0.75rem; margin-top:1.5rem; }
      a.btn { text-decoration:none; font-weight:600; padding:0.85rem 1.15rem; display:inline-flex; min-height:2.75rem; align-items:center; }
      a.primary { background:#191f39; color:#fffbdc; }
      a.ghost { color:#191f39; outline:1px solid #191f3938; }
    </style>
  </head>
  <body>
    <main class="wrap">
      <article class="card">
        <p class="kicker">SPICe Lab</p>
        <h1>La bitácora de tu huerto.</h1>
        <p>Cuaderno digital para clientes de Huerto Rentable. Entras con Google y el código que te mandó SPICe.</p>
        <div class="actions">
          <a class="btn primary" href="https://cabin-ivory-granite-rapid.grok.me">Abrir Huerto</a>
          <a class="btn ghost" href="https://agro.spicelab.cl/huerto-rentable">Huerto Rentable</a>
        </div>
      </article>
    </main>
  </body>
</html>
