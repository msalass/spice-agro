# =====================================================================
# SPICe Agro — agro.spicelab.cl
# Sitio estático hecho a mano (sin generador). Netlify solo publica.
# =====================================================================

[build]
  # No hay paso de build: se publica la raíz del repo tal cual.
  publish = "."
  command = ""

[functions]
  directory = "netlify/functions"
  # esbuild is Netlify's default and matches the existing functions
  # (CommonJS exports.handler, no native addons or dynamic requires).
  node_bundler = "esbuild"

# chat.js reads the knowledge files at runtime (inline fallback if missing).
[functions.chat]
  included_files = ["knowledge/spicelab.md", "knowledge/huerto.md", "knowledge/agro-prices.md"]

# --- Cabeceras de seguridad (todas las rutas) ---
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
    # Nota: NO se fija Content-Security-Policy estricta a propósito,
    # para no bloquear GTM / Google Ads / Doppler / Flow cuando se agreguen,
    # ni el widget SPICe (/spice-widget.js, fuentes de Google, /.netlify/functions/chat).

# --- Caché larga para assets versionables ---
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Las páginas HTML deben revalidarse (para que los deploys se vean al instante)
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# El widget vive en la raíz publicada; revalidar para que un deploy se vea al instante.
[[headers]]
  for = "/spice-widget.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# --- Redirects de programas retirados (301, preservan SEO) ---
[[redirects]]
